[project]
name = "claude-plugins"
version = "0.1.0"
description = "Claude Code plugin marketplace (oliphant-plugins) and its dev/CI tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
# Repo-wide dev tooling.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "typesafe-sdk>=0.7",
]

[tool.pytest.ini_options]
# `uv run --group dev pytest` from the repo root discovers every plugin's tests, scripts/tests, and the
# experiment harnesses' tests under ai_docs/experiments.
testpaths = ["plugins", "scripts", "ai_docs"]

[tool.ruff]
line-length = 100
