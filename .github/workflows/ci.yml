name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Repo-wide checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Run version, shared-sync, test, lint, and format checks
        run: uv run --group dev python scripts/check_all.py

  version-bumps:
    name: Changed plugins have versions above main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every changed plugin's version against main
        run: python3 scripts/check_version_bumps.py --base origin/main
