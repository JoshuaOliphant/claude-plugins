[project]
name = "jev-lint-dev"
version = "0.1.0"
description = "Dev tooling for the jev-lint plugin (the linter declares its runtime deps inline)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "typesafe-sdk>=0.7"]

[tool.pytest.ini_options]
addopts = "--cov=extract --cov=rules --cov=jev_lint --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
