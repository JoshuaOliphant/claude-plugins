[project]
name = "compost-dev"
version = "0.1.0"
description = "Dev tooling for the compost plugin (pile.py and review_diff are stdlib-only; jev.py and lint/ bring typesafe-sdk via inline metadata)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "cosmic-ray>=8.7.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.6",
    "typesafe-sdk>=0.7.1",
]

[tool.pytest.ini_options]
addopts = "-m \"not jev\" --cov=pile --cov=jev --cov=jevtools --cov=stop_guard --cov=skill_drift --cov=doc_refs --cov=jev_lint --cov=extract --cov=rules --cov=run_eval --cov=collect --cov=serve --cov=thin --cov-report=term-missing"
markers = ["jev: live evals against the TypeSafe API (uv run --group dev pytest -m jev)"]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
