[project]
name = "compost-dev"
version = "0.1.0"
description = "Dev tooling for the compost plugin (runtime is stdlib-only)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pyyaml>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "--cov=pile --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
