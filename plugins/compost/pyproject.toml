[project]
name = "compost-dev"
version = "0.1.0"
description = "Dev tooling for the compost plugin (pile.py is stdlib-only; jev.py brings typesafe-sdk via inline metadata)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.6",
    "typesafe-sdk>=0.7.1",
]

[tool.pytest.ini_options]
addopts = "-m \"not jev\" --cov=pile --cov=jev --cov=jevtools --cov-report=term-missing"
markers = ["jev: live evals against the TypeSafe API (uv run --group dev pytest -m jev)"]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
