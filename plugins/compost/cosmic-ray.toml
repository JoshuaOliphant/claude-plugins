[cosmic-ray]
module-path = "scripts"
timeout = 60.0
excluded-modules = []
# The whole suite, not the tests that import the mutated module: a test can reach a module through
# a subprocess or a fixture. The two ignored files cannot: test_workflow.py stubs jev.py and
# test_skill_drift_mod.py only reads the TypeScript hook. test_thin.py runs on its own, outside
# xdist: thin.py forks, and forking a multi-threaded xdist worker can deadlock, which would time
# out. cosmic-ray scores a timeout as killed, so keep this well under `timeout`. cosmic-ray splits
# the command with shlex and runs no shell, hence `sh -c` for the `&&`.
test-command = "sh -c 'python -m pytest -x -q -p no:cacheprovider --no-cov -n auto --ignore=tests/test_workflow.py --ignore=tests/test_skill_drift_mod.py --ignore=tests/test_thin.py && python -m pytest -x -q -p no:cacheprovider --no-cov tests/test_thin.py'"

[cosmic-ray.distributor]
name = "local"
