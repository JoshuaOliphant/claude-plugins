# stockflow configuration
[data]
catalog = data/catalog.json
units = data/units.json
opening_balances = data/opening_balances.json

[ingest]
workers = 4
pattern = *.csv
strict_catalog = true
allow_inactive_skus = false
max_errors_per_file = 50

[report]
low_stock_margin = 5

[warehouses]
codes = PDX1, SEA2, BOI1
