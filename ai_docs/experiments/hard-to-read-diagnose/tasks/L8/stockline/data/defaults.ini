[store]
path = stockline.json

[pricing]
currency = USD

[import]
# Progress is written to the run record every N rows so `stockline runs`
# can show how far a long import has got.
progress_every = 50
# Abort if more than this share of rows is rejected (bad export upstream).
max_reject_ratio = 0.2
min_rows_for_reject_check = 50
dedupe_window = 64
fuzzy_threshold = 0.92
allow_name_match = true

[files]
pricing_rules = pricing_rules.json
categories = categories.json
suppliers = suppliers.json
